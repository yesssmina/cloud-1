---
# This role deploys the full application stack via Docker Compose
# MySQL + WordPress + phpMyAdmin + Nginx in isolated containers

# Step 1: Create project directory
- name: Create project directory
  file:
    path: /opt/wordpress
    state: directory
    mode: '0755'

# Step 2: Deploy docker-compose
- name: Deploy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: /opt/wordpress/docker-compose.yml
    mode: '0600'
